name: WS/REST bots — compile check

# Step 1 verifier for the WS/REST CI route: the draft ws_bot/rest_bot are now
# real CMake targets, so this proves they actually COMPILE on x86 (they never
# were before — they sat in src/ unbuilt). Green here = the drafts are buildable;
# red = the exact compile error Manish fixes next. No synthetic claims, just "does
# it build".

on:
  push:
    branches: [main]
    paths:
      - 'bot-engine/src/ws_bot.cpp'
      - 'bot-engine/src/rest_bot.cpp'
      - 'bot-engine/CMakeLists.txt'
      - '.github/workflows/wsrest-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + HdrHistogram_c
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake g++ git zlib1g-dev
          git clone --depth 1 --branch 0.11.8 https://github.com/HdrHistogram/HdrHistogram_c.git /tmp/hdr_c
          cd /tmp/hdr_c && mkdir build && cd build
          cmake .. -DHDR_HISTOGRAM_BUILD_PROGRAMS=OFF -DHDR_HISTOGRAM_BUILD_SHARED=OFF
          make -j && sudo make install && sudo ldconfig

      - name: Build bot-engine (incl. ws_bot + rest_bot)
        working-directory: bot-engine
        env:
          CMAKE_PREFIX_PATH: /usr/local
        run: |
          mkdir -p build && cd build
          cmake ..
          make -j ws_bot rest_bot refserver

      - name: Assert the WS/REST bot binaries exist
        working-directory: bot-engine/build
        run: |
          ls -la ws_bot rest_bot refserver
          echo "✅ ws_bot + rest_bot compile on x86"

      - name: WS end-to-end smoke — assert Sent==Acked (real loop, no synthetic acks)
        run: |
          npm install ws --no-audit --no-fund --prefix .
          ./bot-engine/build/refserver --port 9000 --journal /tmp/ref.jrn & RS=$!
          sleep 1
          node platform/wsrest-adapters/ws_adapter.js --port 9001 --engine-host 127.0.0.1 --engine-port 9000 & AD=$!
          sleep 1
          ./bot-engine/build/ws_bot --ip 127.0.0.1 --port 9001 --path /orders --interval-us 200 --duration-sec 5 | tee /tmp/ws_out.txt
          kill -9 $RS $AD 2>/dev/null || true
          python3 - <<'PY'
          import re
          t = open('/tmp/ws_out.txt').read()
          m = re.search(r'sent=(\d+)\s+acked=(\d+)', t)
          assert m, "no sent/acked line in ws_bot output:\n" + t
          sent, acked = int(m.group(1)), int(m.group(2))
          print(f"sent={sent} acked={acked}")
          assert acked > 0, "FAIL: acked==0 — RX not correlating acks"
          assert acked >= sent * 0.95, f"FAIL: too many unacked ({sent-acked}/{sent})"
          print("✅ WebSocket board is REAL: Sent==Acked over ws_bot -> ws_adapter -> reference-engine")
          PY

      - name: REST end-to-end smoke — assert Sent==Acked (real loop, JSON↔SBE↔engine)
        run: |
          ./bot-engine/build/refserver --port 9010 --journal /tmp/ref_rest.jrn & RS=$!
          sleep 1
          node platform/wsrest-adapters/rest_adapter.js --port 9002 --engine-host 127.0.0.1 --engine-port 9010 & AD=$!
          sleep 1
          ./bot-engine/build/rest_bot --ip 127.0.0.1 --port 9002 --interval-us 400 --duration-sec 5 | tee /tmp/rest_out.txt
          kill -9 $RS $AD 2>/dev/null || true
          python3 - <<'PY'
          import re
          t = open('/tmp/rest_out.txt').read()
          m = re.search(r'sent=(\d+)\s+acked=(\d+)', t)
          assert m, "no sent/acked line in rest_bot output:\n" + t
          sent, acked = int(m.group(1)), int(m.group(2))
          print(f"sent={sent} acked={acked}")
          assert acked > 0, "FAIL: acked==0 — REST adapter not acking"
          assert acked >= sent * 0.95, f"FAIL: too many unacked ({sent-acked}/{sent})"
          print("✅ REST board is REAL: Sent==Acked over rest_bot -> rest_adapter -> reference-engine")
          PY
