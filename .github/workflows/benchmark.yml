name: Benchmark
on:
  push:
    branches: [main]
    paths:
      - 'bot-engine/**'
      - 'contracts/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'bot-engine/**'

jobs:
  build-and-benchmark:
    name: Build + CO proof + clean run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake g++ python3 \
            libhdrhistogram-dev procps psmisc

      - name: Show environment
        run: |
          uname -a
          echo "--- CPU ---"
          lscpu | head -25
          echo "--- HDR library ---"
          dpkg -l libhdrhistogram-dev | tail -1
          find /usr -name 'hdr_histogram.h' 2>/dev/null | head -3
          find /usr -name 'libhdr_histogram*' 2>/dev/null | head -3
          echo "--- CMake ---"
          cmake --version | head -1

      - name: Build bot-engine
        working-directory: bot-engine
        run: |
          mkdir -p build && cd build
          cmake ..
          make -j

      - name: List built binaries
        working-directory: bot-engine/build
        run: ls -la bot null_responder refengine buggy_engine hdr_merge refserver

      - name: CO proof — stall run (1 bot, 30s, 100us, 5ms stall every 20k)
        working-directory: bot-engine
        run: |
          # Start stall-mode responder in background
          ./build/null_responder --stall-mode --stall-every 20000 --stall-ms 5 \
            > /tmp/null_responder_stall.log 2>&1 &
          NR_PID=$!
          sleep 2

          # Run bot with CPU pinning (start-core 1 — skip core 0 for IRQs)
          ./build/bot \
            --bots 1 \
            --start-core 1 \
            --interval-us 100 \
            --duration-sec 30 \
            --no-gate \
            > demo_results/stall_run_20k_5ms.txt 2>&1 || true

          # Cleanup
          kill -9 $NR_PID 2>/dev/null || true
          wait $NR_PID 2>/dev/null || true

          echo "=== stall_run_20k_5ms.txt ==="
          cat demo_results/stall_run_20k_5ms.txt
          echo "=== null_responder stall log (last 20 lines) ==="
          tail -20 /tmp/null_responder_stall.log

      - name: Clean run (4 bots, 10s, 100us, no stall)
        working-directory: bot-engine
        run: |
          # Make sure nothing leftover
          pkill -f null_responder 2>/dev/null || true
          sleep 1

          # Start clean responder
          ./build/null_responder > /tmp/null_responder_clean.log 2>&1 &
          NR_PID=$!
          sleep 2

          # Run bot — 4 bots pinned starting at core 1
          ./build/bot \
            --bots 4 \
            --start-core 1 \
            --interval-us 100 \
            --duration-sec 10 \
            --no-gate \
            > demo_results/clean_run_10s.txt 2>&1 || true

          # Cleanup
          kill -9 $NR_PID 2>/dev/null || true
          wait $NR_PID 2>/dev/null || true

          echo "=== clean_run_10s.txt ==="
          cat demo_results/clean_run_10s.txt
          echo "=== null_responder clean log (last 20 lines) ==="
          tail -20 /tmp/null_responder_clean.log

      - name: Smoke-test correctness validator (demo)
        working-directory: bot-engine
        run: |
          # Generate demo journal + replay through ref + buggy engines + diff
          mkdir -p /tmp/demo_artifacts
          python3 demo/make_demo_journal.py /tmp/demo_artifacts/input.jrn
          ./build/refengine     replay /tmp/demo_artifacts/input.jrn /tmp/demo_artifacts/correct.jrn
          ./build/buggy_engine  replay /tmp/demo_artifacts/input.jrn /tmp/demo_artifacts/buggy.jrn
          echo "=== Sizes (should be identical) ==="
          ls -la /tmp/demo_artifacts/
          echo "=== Diff output (should report DIVERGE at byte N) ==="
          ./build/refengine diff /tmp/demo_artifacts/correct.jrn /tmp/demo_artifacts/buggy.jrn || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            bot-engine/demo_results/*.txt
            /tmp/null_responder_*.log
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Runner: \`$(uname -m) $(uname -s) $(uname -r)\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CO Proof (stall run)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -A 12 "AGGREGATE ROUND-TRIP LATENCY" bot-engine/demo_results/stall_run_20k_5ms.txt | head -15 >> $GITHUB_STEP_SUMMARY || echo "(parse failed)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Clean Run" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -A 12 "AGGREGATE ROUND-TRIP LATENCY" bot-engine/demo_results/clean_run_10s.txt | head -15 >> $GITHUB_STEP_SUMMARY || echo "(parse failed)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
