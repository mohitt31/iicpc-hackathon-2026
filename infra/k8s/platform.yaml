# ============================================================================
# IICPC HFT Benchmarking Platform — Kubernetes (production path)
#
# This is the low-latency deployment. The bot fleet runs as a bare-metal
# DaemonSet with Guaranteed QoS and pinned cores, so the Linux-only perf
# features (CPU pinning, SO_BUSY_POLL, HW timestamping) actually engage —
# unlike the Docker Compose demo path.
#
# Apply order:
#   kubectl apply -f infra/k8s/namespace.yaml
#   kubectl apply -f infra/k8s/                 # the rest
#
# STATUS: deliverable blueprint. Mirrors the Interface Contract §10 skeleton.
#         Image refs are placeholders (ghcr.io/<org>/...) — wire to your
#         registry. Not applied against a live cluster in this repo.
# ============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: hft-bench
  labels:
    app.kubernetes.io/part-of: iicpc-hft-platform
---
# ---- Reference matching engine — the gold standard the bot fleet benchmarks --
# (Was missing: the bot fleet had TARGET_ENGINE_IP=REPLACE_... with nothing to
#  hit, so the k8s loop was broken. This is the engine all bots connect to.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reference-engine
  namespace: hft-bench
  labels: { app: reference-engine }
spec:
  replicas: 1
  selector:
    matchLabels: { app: reference-engine }
  template:
    metadata:
      labels: { app: reference-engine }
    spec:
      containers:
        - name: engine
          image: ghcr.io/mohitt31/iicpc-bot-engine:latest
          command: ["stdbuf", "-oL", "-eL", "./build/refserver"]
          args: ["--port", "9000", "--journal", "/tmp/refserver.jrn"]
          ports: [{ containerPort: 9000, name: sbe }]
---
apiVersion: v1
kind: Service
metadata:
  name: reference-engine
  namespace: hft-bench
spec:
  selector: { app: reference-engine }
  ports:
    - { name: sbe, port: 9000, targetPort: 9000 }
---
# ---- Bot fleet — DaemonSet, one pinned generator per benchmark node --------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bot-fleet
  namespace: hft-bench
  labels: { app: bot-fleet }
spec:
  selector:
    matchLabels: { app: bot-fleet }
  template:
    metadata:
      labels: { app: bot-fleet }
    spec:
      # only schedule on nodes provisioned as isolated benchmark hardware
      nodeSelector:
        node-role.hft/benchmark: "true"
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "benchmark"
          effect: "NoSchedule"
      hostNetwork: true            # avoid the CNI overlay for the hot path
      dnsPolicy: ClusterFirstWithHostNet   # so 'reference-engine' service DNS resolves under hostNetwork
      containers:
        - name: bot
          image: ghcr.io/mohitt31/iicpc-bot-engine:latest
          command: ["stdbuf", "-oL", "-eL", "./build/bot"]
          # --no-gate: the integrity self-test can't pass inside a container (no
          # CPU pinning), so it CrashLoops with the gate on. This is a scale +
          # accounting run, not a latency run — the gate belongs on bare-metal.
          # --duration-sec=0: run continuously for the live demo.
          args:
            - "--bots"
            - "8"
            - "--interval-us"
            - "50"
            - "--duration-sec"
            - "0"
            - "--no-gate"
            - "--ip"
            - "$(TARGET_ENGINE_IP)"
            - "--port"
            - "9000"
            - "--snapshot-dir"
            - "/telemetry"
          env:
            - name: TARGET_ENGINE_IP
              value: "reference-engine"     # k8s Service DNS in the hft-bench namespace
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]   # required for SO_BUSY_POLL / SO_TIMESTAMPING
          resources:
            # Schedulable on a laptop node for the scale/accounting run. For the
            # bare-metal latency path, raise to integer CPU (Guaranteed QoS) +
            # the kubelet static CPU-manager policy for exclusive pinned cores.
            requests: { cpu: "1", memory: "512Mi" }
            limits:   { cpu: "2", memory: "1Gi" }
          volumeMounts:
            - { name: telemetry, mountPath: /telemetry }
      volumes:
        - name: telemetry
          emptyDir: {}
---
# ---- Telemetry gateway — scores + ranks, serves the leaderboard feed -------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-gateway
  namespace: hft-bench
  labels: { app: telemetry-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: telemetry-gateway }
  template:
    metadata:
      labels: { app: telemetry-gateway }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/mohitt31/iicpc-telemetry-gateway:latest
          args: ["node", "telemetry_server.js", "--port=8080", "--snapshot-dir=/telemetry"]
          ports: [{ containerPort: 8080, name: ws }]
          resources:
            requests: { cpu: "500m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-gateway
  namespace: hft-bench
spec:
  selector: { app: telemetry-gateway }
  ports:
    - { name: ws, port: 8080, targetPort: 8080 }
---
# ---- Leaderboard — static frontend, display-only ---------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaderboard
  namespace: hft-bench
  labels: { app: leaderboard }
spec:
  replicas: 2
  selector:
    matchLabels: { app: leaderboard }
  template:
    metadata:
      labels: { app: leaderboard }
    spec:
      containers:
        - name: web
          image: ghcr.io/mohitt31/iicpc-leaderboard:latest   # nginx + frontend/
          ports: [{ containerPort: 80, name: http }]
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: leaderboard
  namespace: hft-bench
spec:
  type: LoadBalancer
  selector: { app: leaderboard }
  ports:
    - { name: http, port: 80, targetPort: 80 }
